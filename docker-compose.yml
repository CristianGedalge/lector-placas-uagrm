services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alpr_backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_runtime:/app/.runtime

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: alpr_frontend
    restart: always
    environment:
      - VITE_PROXY_TARGET=http://backend:8000
      - VITE_API_BASE_URL=/api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  backend_runtime:
