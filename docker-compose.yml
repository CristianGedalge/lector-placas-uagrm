services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alpr_backend
    restart: unless-stopped
    init: true
    env_file:
      - ./backend/.env
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - backend_media_spool:/app/.runtime/media-spool
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/plates/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: alpr_frontend
    restart: unless-stopped
    init: true
    ports:
      - "5173:8443"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--quiet", "--spider", "https://127.0.0.1:8443/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true

volumes:
  backend_media_spool:
